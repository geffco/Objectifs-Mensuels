name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ObjectifsMensuels_v1.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Décompresser le projet
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q ObjectifsMensuels_v1.zip -d build-project

            - name: Corriger les cibles JVM
        working-directory: build-project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              'android { namespace = "fr.objectifs.mensuels"; compileSdk = 35',
              '''android {
              namespace = "fr.objectifs.mensuels"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }'''
          )
          p.write_text(s)
          PY

      - name: Compiler l'APK
        working-directory: build-project
        run: gradle assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ObjectifsMensuels-v1-debug
          path: build-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
